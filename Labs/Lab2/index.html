<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Calculadora com JavaScript 1.0</h1>
    <label for="num1">Primeiro número:</label>
    <input type="number" id="num1" placeholder="Digite um número">
    <label for="num2">Segundo número:</label>
    <input type="number" id="num2" placeholder="Digite um número">
    <button id="btnCalcular">Calcular</button>
    <section id="resultado" aria-live="polite">
      Os resultados aparecerão aqui.
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
